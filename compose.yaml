services:
  php:
    build:
      context: .
    volumes:
      - .:/var/www/html:ro
      - /var/www/html/vendor

  web:
    image: nginx:1.28-alpine
    depends_on:
      - php
    ports:
      - "127.0.0.1:${CALENDORAMA_PORT:-8010}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  tests:
    build:
      context: .
    command: ["php", "-d", "error_reporting=E_ALL", "tests/run.php"]
    profiles: ["test"]
