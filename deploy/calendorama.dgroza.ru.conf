map "$uri:$arg_v" $calendorama_cache_control {
    default "";
    "~^/(?:style\.css|script\.js):[a-f0-9]{12}$" "public, max-age=31536000, immutable";
    "~^/(?:style\.css|script\.js):" "no-cache";
    "~^/(?:favicon\.ico|flakes\.jpg|wait\.gif|blog/[0-9]+_[0-9]+_(?:thmb|full)(?:_[0-9]+)?\.jpg):" "public, max-age=31536000, immutable";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name calendorama.dgroza.ru;
    root /var/www/calendorama/public;
    index index.php;

    add_header Cache-Control $calendorama_cache_control;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    ssl_certificate /etc/letsencrypt/live/calendorama.dgroza.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendorama.dgroza.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /handler.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name calendorama.dgroza.ru;
    return 301 https://$host$request_uri;
}
