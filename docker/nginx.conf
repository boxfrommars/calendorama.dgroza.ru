server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location = /handler.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ ^/(?:AGENTS\.md|Dockerfile|compose\.yaml|README\.md)$ {
        return 404;
    }

    location ^~ /docker/ {
        return 404;
    }

    location ^~ /deploy/ {
        return 404;
    }

    location ^~ /tests/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
